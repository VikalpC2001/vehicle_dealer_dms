# Production stack for one VM: edge nginx → frontend + API → PostgreSQL.
#
# Do not run this file by hand with a bare `docker compose up`: the scripts in deploy/scripts pass the
# environment it needs (`--env-file $SHARED_DIR/.env`, `SHARED_DIR`, `IMAGE_TAG`). For ad-hoc commands
# use `deploy/scripts/dc.sh <compose arguments>` on the server, which does the same.
#
# Data safety: both data volumes are EXTERNAL (created once by the scripts). `docker compose down`,
# even with `-v`, never deletes them.

name: ${COMPOSE_PROJECT_NAME:-dcarjt}

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}
    env_file:
      - ${SHARED_DIR:?SHARED_DIR is not set}/postgres.env
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-2000}
      # Slow statements are logged without their parameter values (personal data, password hashes).
      - -c
      - log_parameter_max_length=0
    # PostgreSQL 18 images keep data in a major-version directory under /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: ${PG_SHM_SIZE:-256mb}
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint starts as root, prepares the data directory and drops to the postgres user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-1g}
    logging: *logging

  api:
    image: ${REGISTRY:?REGISTRY is not set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is not set}/api:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file:
      - ${SHARED_DIR}/api.env
    environment:
      NODE_ENV: production
      PORT: "4002"
      UPLOAD_DIR: uploads
      LOG_TO_FILES: "false"
      # Local time for dates the API formats or groups by day (exports). Stored timestamps stay UTC.
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_MS (default 25 s) so open requests can finish before SIGKILL.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
    logging: *logging

  # One-off jobs only (`--profile tools`): `prisma migrate deploy` by default; bootstrap.sh runs the
  # seed scripts with the same image.
  migrate:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/api-migrate:${IMAGE_TAG}
    profiles:
      - tools
    env_file:
      - ${SHARED_DIR}/api.env
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    restart: "no"
    logging: *logging

  frontend:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-128m}
    logging: *logging

  nginx:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86}
    # Our own configuration only: skip the image's entrypoint scripts (they edit /etc/nginx/conf.d).
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/live/nginx.conf", "-g", "daemon off;"]
    # Unprivileged nginx listens on 8080/8443 inside the container.
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    # Configuration is rendered from deploy/nginx by the deploy script into SHARED_DIR/nginx/live,
    # tested, and then reloaded (see render_nginx in scripts/lib.sh). The directory is updated in
    # place, so this mount always shows the current files.
    volumes:
      - ${SHARED_DIR}/nginx/live:/etc/nginx/live:ro
      - ${SHARED_DIR}/certs:/etc/nginx/certs:ro
    # The deploy user's group: lets nginx (uid 101) read the private key in shared/certs, which is
    # chmod 640 and not readable by anyone else on the server.
    group_add:
      - "${DEPLOY_GID:?DEPLOY_GID is not set}"
    depends_on:
      - api
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-256m}
    logging: *logging

networks:
  # Reaches the internet (the API calls Gemini and SMTP) and carries proxied traffic.
  edge: {}
  # Database traffic only: no route to the internet, nothing published.
  backend:
    internal: true

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME:-dcarjt_postgres_data}
  uploads:
    external: true
    name: ${UPLOADS_VOLUME:-dcarjt_uploads}
