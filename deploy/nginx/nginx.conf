# Edge proxy main configuration (nginxinc/nginx-unprivileged: runs as uid 101, listens on 8080/8443
# inside the container; the host publishes them as 80/443). Server blocks are rendered from
# templates/default.conf.template into conf.d/ by scripts/lib.sh (render_nginx).
#
# In the container everything lives under /etc/nginx/live (SHARED_DIR/nginx/live on the host), and
# nginx is started with `-c /etc/nginx/live/nginx.conf`. The deploy scripts update that directory in
# place (never by renaming it), because a bind mount keeps pointing at the directory it was given.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths for the unprivileged user (the container root filesystem is read-only).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Real visitor address from Cloudflare (only trusted when the connection comes from Cloudflare).
    include /etc/nginx/live/snippets/cloudflare-realip.conf;

    # Agent-invitation links carry a one-time token in the path: keep it out of the access log.
    map $request_uri $log_uri {
        "~^(?<log_prefix>/agent-onboarding/|/api/v1/agent-invitations/accept/)[^/?]+(?<log_rest>.*)$" "${log_prefix}[redacted]${log_rest}";
        default $request_uri;
    }
    map $http_referer $log_referer {
        "~^(?<ref_prefix>.*/agent-onboarding/)[^/?]+(?<ref_rest>.*)$" "${ref_prefix}[redacted]${ref_rest}";
        default $http_referer;
    }

    log_format main '$remote_addr - [$time_local] "$request_method $log_uri $server_protocol" $status $body_bytes_sent '
                    '"$log_referer" "$http_user_agent" host=$host rt=$request_time '
                    'urt=$upstream_response_time cf_ray=$http_cf_ray';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    types_hash_max_size 2048;

    # Client-side timeouts (upstream timeouts are set per location).
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Keep-alive to the upstreams unless the client asks for a protocol upgrade (WebSocket).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's embedded DNS: upstream names (api, frontend) are re-resolved, so a recreated
    # container with a new address is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/live/conf.d/*.conf;
}
