# Response headers for the web app (the API sets its own through Helmet).
# Deliberately no Content-Security-Policy: the app loads Google Fonts, blob: previews and inline
# styles from UI libraries, and a policy needs testing against every page before it is enforced.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
