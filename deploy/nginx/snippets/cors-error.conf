# CORS headers on the error responses nginx itself produces for the API (JSON 503/429/413), so the
# web app on https://$DOMAIN can read them. $cors_allow_origin is empty for any other origin, and
# nginx then leaves that header out.
add_header Access-Control-Allow-Origin $cors_allow_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Vary "Origin" always;
