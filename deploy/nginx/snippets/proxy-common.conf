# Upstream request settings shared by every proxied location.
proxy_http_version 1.1;

# $remote_addr is the real visitor here (see cloudflare-realip.conf). X-Forwarded-For is SET, not
# appended, so a client cannot inject addresses; the API trusts exactly one proxy hop (TRUST_PROXY=1).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Keep-alive to the upstream; upgraded (WebSocket) connections pass through if ever used.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
