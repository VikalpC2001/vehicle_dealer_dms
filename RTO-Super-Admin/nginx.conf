# Static server inside the frontend image (nginxinc/nginx-unprivileged, port 8080).
# TLS, domains and security headers are handled by the edge proxy in deploy/nginx/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # The edge proxy logs every request (with invitation tokens redacted); no second copy here.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every file name under /assets/, so these never change: cache for a year.
    # A missing asset is a real 404 (never the app shell).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The app shell: always revalidated, so a new deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: any other path is a client-side route, so serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
